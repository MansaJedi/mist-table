<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f1315;--glass:rgba(16,20,22,.78);--panel:rgba(14,17,19,.93);--soft:rgba(255,255,255,.05);--line:rgba(236,230,216,.14);--ink:#ece6d8;--dim:#a39d8f;--gold:#d2b47a;--gold2:#f0d9a6;--moss:#93b98d;--rust:#de8370;--r:14px;
--font:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}

/* stage */
#stage{position:fixed;inset:0;background:#0b0e10}
.layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .9s ease}
.layer.on{opacity:1}.layer.contain{background-size:contain}
#empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 20%,#25312f 0,transparent 60%),radial-gradient(ellipse at 80% 90%,#2a2a33 0,transparent 55%),#0f1315;transition:opacity .9s}
#empty.hide{opacity:0;pointer-events:none}
.mist{position:absolute;width:70vmax;height:40vmax;border-radius:50%;background:rgba(210,220,215,.07);filter:blur(60px);animation:drift 26s ease-in-out infinite alternate}
.m1{left:-20vmax;bottom:-10vmax}.m2{right:-25vmax;top:-5vmax;animation-duration:34s}
@keyframes drift{to{transform:translate(12vmax,-4vmax)}}
.etxt{position:relative;text-align:center;padding:24px}
.etitle{font-family:var(--serif);font-size:clamp(40px,8vw,72px);font-weight:600;letter-spacing:.02em;color:var(--gold2)}
.esub{color:var(--dim);margin-top:6px;font-size:17px}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 18px calc(env(safe-area-inset-left) + 12px);background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
#top>*{pointer-events:auto}
#sceneName{flex:1;min-width:0;font-family:var(--serif);font-size:22px;font-weight:600;text-shadow:0 1px 10px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:72vw}.tb::-webkit-scrollbar{display:none}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 15px;min-height:40px;font-size:15px;font-weight:600;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}

<div id="top"><div id="sceneName"></div><button class="btn" id="showChip" data-act="showchip" hidden></button><div id="net"><span class="dot"></span><span class="lab">Starting…</span></div><div class="tb" id="tb"></div></div>
<div id="feed"></div>
<div id="showcase" hidden><div class="dh"><h2><small>The GM is showing</small><span class="sct"></span></h2><button class="ib" data-act="scclose" aria-label="Close">✕</button></div><div class="scb"></div></div>
<aside id="drawer"><div class="dh"><button class="ib" id="dBack" data-act="back" hidden>‹</button><h2 id="dTitle"></h2><button class="btn" id="dShow" data-act="showcase" hidden></button><button class="ib" data-act="close">✕</button></div><div id="dBody"></div></aside>
<div id="tray">
  <h3>Roll <button class="add" data-act="cleartray">Clear</button></h3>
  <div class="chips" id="trayChips"></div>
  <div class="modrow"><span class="grow">Extra modifier</span><button class="ib" data-act="mod" data-d="-1">−</button><b id="modVal">0</b><button class="ib" data-act="mod" data-d="1">+</button></div>
  <div class="modrow"><span class="power grow">Power <b id="powerVal">+0</b></span><button class="btn primary" data-act="roll2d6">Roll 2d6</button></div>
  <div class="dn">
    <button data-act="dn" data-n="4">d4</button><button data-act="dn" data-n="6">d6</button><button data-act="dn" data-n="8">d8</button><button data-act="dn" data-n="10">d10</button><button data-act="dn" data-n="12">d12</button><button data-act="dn" data-n="20">d20</button><button data-act="dn" data-n="100">d%</button>
  </div>
</div>
<button id="diceBtn" data-act="dice" aria-label="Dice"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="5" width="22" height="22" rx="5"/><circle cx="11" cy="11" r="1.6" fill="currentColor"/><circle cx="21" cy="11" r="1.6" fill="currentColor"/><circle cx="16" cy="16" r="1.6" fill="currentColor"/><circle cx="11" cy="21" r="1.6" fill="currentColor"/><circle cx="21" cy="21" r="1.6" fill="currentColor"/></svg><span class="badge" id="badge" hidden>0</span></button>
<div id="toast"></div>
<div id="snack"></div>
<div id="modal"></div>
<input type="file" id="sceneFile" accept="image/*" multiple hidden>
<input type="file" id="portraitFile" accept="image/*" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const str=(v,max=300)=>typeof v==='string'?v.slice(0,max):'';
const int=(v,lo,hi)=>{v=Math.round(Number(v));return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):lo};
const arr=(v,max,fn)=>Array.isArray(v)?v.slice(0,max).map(fn):[];
const sign=v=>(v<0?'−':'+')+Math.abs(v);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const isImg=v=>typeof v==='string'&&/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1};
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v};

const JOIN=(new URLSearchParams(location.search).get('join')||'').replace(/[^\w-]/g,'');
const GM=!JOIN;
const MIGHT=['Origin','Adventure','Greatness'];
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]};
const OUT={good:'Success',mid:'Success with a cost',bad:'Consequences'};

/* ---------- storage (IndexedDB) ---------- */
const idb=(()=>{let dbp;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('mist-table',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())}})();

/* ---------- data model ---------- */
const tag=t=>({text:str(t&&t.text,120),burned:!!(t&&t.burned)});
function normTheme(t){t=t||{};return{might:MIGHT.includes(t.might)?t.might:'Origin',book:str(t.book,80),title:str(t.title,120),titleBurned:!!t.titleBurned,
  power:arr(t.power,12,tag),weakness:arr(t.weakness,6,w=>({text:str(w&&w.text,120)})),quest:str(t.quest,400),
  improve:int(t.improve,0,3),abandon:int(t.abandon,0,3),milestone:int(t.milestone,0,3),notes:str(t.notes,1000)}}
function normSheet(s){s=s||{};const themes=arr(s.themes,4,normTheme);while(themes.length<4)themes.push(normTheme({power:[{},{}],weakness:[{}]}));
  return{id:str(s.id,40)||uid(),ownerKey:s.ownerKey?str(s.ownerKey,60):null,name:str(s.name,80),promise:int(s.promise,0,5),quintessences:str(s.quintessences,1000),
  relationships:arr(s.relationships,12,r=>({name:str(r&&r.name,60),tag:str(r&&r.tag,120)})),backpack:arr(s.backpack,24,tag),themes,
  fellowship:normTheme(s.fellowship||{power:[{},{}],weakness:[{}]}),portrait:isImg(s.portrait)&&s.portrait.length<400000?s.portrait:'',statuses:arr(s.statuses,16,x=>({name:str(x&&x.name,60),tier:int(x&&x.tier,0,6)})),storyTags:arr(s.storyTags,24,tag),notes:str(s.notes,4000)}}
const newSheet=()=>normSheet({name:'New hero',relationships:[{}],backpack:[{}],themes:[0,1,2,3].map(()=>({power:[{},{}],weakness:[{}]}))});
function normSheets(o){const r={};if(o&&typeof o==='object')for(const s of Object.values(o)){const n=normSheet(s);r[n.id]=n}return r}
function normRoll(r){if(!r||typeof r!=='object')return null;const kinds=['litm','d4','d6','d8','d10','d12','d20','d100'];if(!kinds.includes(r.kind))return null;
  return{id:str(r.id,40)||uid(),by:str(r.by,40),hero:str(r.hero,80),kind:r.kind,dice:arr(r.dice,2,d=>int(d,1,100)),mod:int(r.mod,-30,30),total:int(r.total,-50,150),
  outcome:['good','mid','bad'].includes(r.outcome)?r.outcome:'',tags:arr(r.tags,20,t=>({label:str(t&&t.label,130),value:int(t&&t.value,-6,6)})),ts:Number(r.ts)||Date.now()}}
function normState(st){st=st||{};const players={};
  if(st.players&&typeof st.players==='object')for(const[k,v]of Object.entries(st.players))players[str(k,60)]={name:str(v&&v.name,40)||'Player'};
  return{v:1,hostId:(str(st.hostId,60).replace(/[^\w-]/g,''))||('mist-'+uid()+uid()),players,sheets:normSheets(st.sheets),
  scenes:arr(st.scenes,300,x=>({id:str(x&&x.id,40)||uid(),name:str(x&&x.name,80),thumb:isImg(x&&x.thumb)?x.thumb:'',fit:x&&x.fit==='contain'?'contain':'cover'})),
  current:st.current?str(st.current,40):null,log:arr(st.log,60,normRoll).filter(Boolean)}}

let S=null;                                        // GM state (saved on the iPad)
const P={sheets:{},scene:null,players:[],log:[],party:[]};  // player view (from the GM)
let me=null;                                       // player identity
const view=()=>GM?S:P;
const myName=()=>GM?'GM':me.name;

let saveT;
const save=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,400);if(GM){scheduleParty();if(showcaseId)scheduleShowcase()}};
async function saveNow(){clearTimeout(saveT);try{await idb.set('state',S)}catch(e){snack('Could not save: '+(e&&e.message||e))}}

/* ---------- UI bits ---------- */
let snackT;
function snack(t){const s=$('#snack');s.textContent=t;s.classList.add('show');clearTimeout(snackT);snackT=setTimeout(()=>s.classList.remove('show'),2400)}
function setNet(state,label){$('#net').innerHTML=`<span class="dot ${state}"></span><span class="lab">${esc(label)}</span>`}
function modal(html,{lock=false}={}){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="mcard">${html}</div>`;m.classList.add('show');
  const done=v=>{m.classList.remove('show');m.onclick=null;res(v)};const inp=m.querySelector('input');
  m.onclick=e=>{const b=e.target.closest('[data-m]');if(b){const v=b.dataset.m;done(v==='ok'?(inp?inp.value:true):v==='cancel'?null:v)}else if(e.target===m&&!lock)done(null)};
  if(inp){setTimeout(()=>inp.focus(),60);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done(inp.value)}}}})}
const ask=(title,val='',ph='')=>modal(`<h3>${esc(title)}</h3><input class="in" value="${esc(val)}" placeholder="${esc(ph)}" maxlength="80"><div class="mbtns"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="ok">OK</button></div>`);
const confirmBox=(t,ok='Delete')=>modal(`<p>${esc(t)}</p><div class="mbtns"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="ok">${esc(ok)}</button></div>`).then(v=>v===true);

function buildTop(){
  $('#tb').innerHTML=GM
    ?`<button class="btn" data-act="panel" data-p="sheets">Heroes</button><button class="btn" data-act="panel" data-p="scenes">Scenes</button><button class="btn" data-act="panel" data-p="players">Players</button><button class="btn" data-act="panel" data-p="menu" aria-label="More">⋯</button>`
    :`<button class="btn" data-act="panel" data-p="sheets">My hero</button><button class="btn" data-act="panel" data-p="players">Table</button>`;
  $('#emptySub').textContent=GM?'Add a scene, then tap it to show it to everyone.':'Waiting for the GM to set the scene…';
}
function markTop(){document.querySelectorAll('#tb .btn').forEach(b=>b.classList.toggle('on',b.dataset.p===panel||(panel==='sheet'&&b.dataset.p==='sheets')))}

/* ---------- stage ---------- */
let flip=false;
function setStage(img,sc){const a=$('#L0'),b=$('#L1');const next=flip?a:b,prev=flip?b:a;
  if(img&&isImg(img)){flip=!flip;next.style.backgroundImage=`url("${img}")`;next.classList.toggle('contain',sc&&sc.fit==='contain');next.classList.add('on');prev.classList.remove('on');$('#empty').classList.add('hide')}
  else{a.classList.remove('on');b.classList.remove('on');$('#empty').classList.remove('hide')}
  $('#sceneName').textContent=sc&&img?sc.name:'';}
async function showScene(id){S.current=id;save();const sc=S.scenes.find(x=>x.id===id);let img='';if(sc){try{img=await idb.get('img:'+sc.id)||''}catch{}}
  setStage(img,sc);broadcastScene();refreshUI('scenes');}

/* ---------- panels ---------- */
let panel=null,openSheetId=null,pendingRefresh=false;
function openPanel(p,arg){
  if(p==='sheets'&&!GM){const ids=Object.keys(P.sheets);if(ids.length===1&&!P.party.length&&panel!=='sheet'){p='sheet';arg=ids[0]}}
  panel=p;openSheetId=p==='sheet'?arg:null;renderPanel();$('#dBody').scrollTop=0;$('#drawer').classList.add('open');document.body.classList.add('dopen');markTop()}
function closePanel(){panel=null;openSheetId=null;$('#drawer').classList.remove('open','full');document.body.classList.remove('dopen');markTop()}
function renderPanel(){if(!panel)return;let title='',html='';
  switch(panel){
    case 'sheets':title=GM?'Heroes':'My heroes';html=renderSheetList();break;
    case 'sheet':{const s=view().sheets[openSheetId];if(!s){panel='sheets';return renderPanel()}title='Hero sheet';html=renderSheet(s);break}
    case 'scenes':title='Scenes';html=renderScenes();break;
    case 'players':title=GM?'Players':'Table';html=GM?renderPlayers():renderTable();break;
    case 'menu':title='Settings';html=renderMenu();break;}
  $('#drawer').classList.toggle('full',panel==='sheet'&&isWide());$('#dTitle').textContent=title;$('#dBack').hidden=panel!=='sheet';$('#dBody').innerHTML=html;pendingRefresh=false;
  const sb=$('#dShow');sb.hidden=!(GM&&panel==='sheet');if(!sb.hidden){const on=showcaseId===openSheetId;sb.textContent=on?'Stop showing':'👁 Show to all';sb.classList.toggle('on',on)}}
function renderKeep(){const b=$('#dBody'),y=b.scrollTop;renderPanel();b.scrollTop=y}
function refreshUI(w){if(panel===w)renderKeep()}
function editingInside(){const a=document.activeElement;return a&&$('#dBody').contains(a)&&a.matches('input,textarea,select')}
function refreshSheet(id){if(panel==='sheet'&&(id==null||openSheetId===id)){if(editingInside())pendingRefresh=true;else renderKeep()}if(panel==='sheets')renderKeep()}
let wideNow=null;addEventListener('resize',()=>{const w=isWide();if(w!==wideNow){wideNow=w;if(panel==='sheet'&&!editingInside())renderKeep();if(!GM)renderShowcase()}});
$('#dBody').addEventListener('focusout',()=>{if(pendingRefresh)setTimeout(()=>{if(pendingRefresh&&!editingInside())renderKeep()},60)});

function themeSummary(s){return s.themes.map(t=>t.title).filter(Boolean).join(' · ')||'Tap to open'}
function renderSheetList(){const list=Object.values(view().sheets);
  let h=GM?`<button class="btn primary wide" data-act="newsheet">+ New hero</button>`:'';
  if(!list.length)h+=`<p class="empty-note">${GM?'No heroes yet. Create one, then assign it to a player inside the sheet.':'The GM hasn’t given you a hero yet.'}</p>`;
  h+=list.map(s=>{const sub=GM?(s.ownerKey&&S.players[s.ownerKey]?'Played by '+S.players[s.ownerKey].name:'Not assigned'):themeSummary(s);
    return`<div class="hwrap">${GM?`<button class="hdel" data-act="delsheet" data-id="${esc(s.id)}" title="Delete hero" aria-label="Delete hero">🗑</button>`:''}<button class="hcard" data-act="opensheet" data-id="${esc(s.id)}">${s.portrait?`<span class="hthumb" style="background-image:url('${s.portrait}')"></span>`:''}<span class="htxt"><span class="hname">${esc(s.name||'Unnamed hero')}</span><span class="hsub">${esc(sub)}</span></span></button></div>`}).join('');
  if(!GM&&P.party.length)h+=`<div class="sec">Fellowship</div>`+P.party.map(x=>`<button class="hcard" data-act="peek" data-id="${esc(x.id)}">${x.portrait?`<span class="hthumb" style="background-image:url('${x.portrait}')"></span>`:'<span class="hthumb none">?</span>'}<span class="htxt"><span class="hname">${esc(x.name||'Unnamed hero')}</span><span class="hsub">${esc(x.player)}</span></span></button>`).join('');
  return h}
function peekHero(id){const x=P.party.find(h=>h.id===id);if(!x)return;
  modal(`<div class="peek">${x.portrait?`<div class="peek-img" style="background-image:url('${x.portrait}')"></div>`:''}<h3>${esc(x.name||'Unnamed hero')}</h3>
  <div class="peek-th">${x.themes.map(t=>`<div class="pt m-${t.might.toLowerCase()}"><span>${MICON[t.might]}</span>${esc(t.title||'—')}</div>`).join('')}</div></div>
  <div class="mbtns"><button class="btn" data-m="cancel">Close</button></div>`)}

function track(path,v,n,numbered){return`<div class="track">${Array.from({length:n},(_,i)=>`<button class="box ${i<v?'on':''}" data-act="track" data-path="${path}" data-n="${i+1}">${numbered?i+1:''}</button>`).join('')}</div>`}
function tagRowGen(tp,text,bp,burned,kind,ph,del){
  return`<div class="row tag ${burned?'burned':''}"><input class="in" data-path="${tp}" value="${esc(text)}" placeholder="${ph}" autocomplete="off">`+
  (bp?`<button class="ib burn ${burned?'on':''}" data-act="burn" data-path="${bp}" title="Burned">🔥</button>`:'')+
  `<button class="ib rb ${kind}" data-act="roll" data-kind="${kind}" data-tp="${tp}" data-bp="${bp||''}" title="Add to roll" ${burned?'disabled':''}>${kind==='weak'?'−':'+'}</button>`+
  (del?`<button class="ib x" data-act="del" data-path="${del[0]}" data-i="${del[1]}" title="Remove">✕</button>`:'')+`</div>`}
const tagRow=(lp,j,x,ph)=>tagRowGen(`${lp}.${j}.text`,x.text,`${lp}.${j}.burned`,x.burned,'power',ph,[lp,j]);
const weakRow=(lp,j,x)=>tagRowGen(`${lp}.${j}.text`,x.text,null,false,'weak','Weakness tag',[lp,j]);
const addBtn=(path,tpl)=>`<button class="add" data-act="add" data-path="${path}" data-tpl="${tpl}">+ Add</button>`;
const MICON={Origin:'🌿',Adventure:'⚔️',Greatness:'👑'};
const isWide=()=>innerWidth>=820&&innerWidth>innerHeight;

const flipped=new Set();
function themeCard(t,b,fellow){
  const key=(renderCtx||openSheetId)+'|'+b,back=flipped.has(key),cls=`pc ${fellow?'fellow':'m-'+t.might.toLowerCase()}`;
  if(back)return`<div class="${cls} back flipin">
  <div class="pch">${fellow?'Fellowship theme card':'Theme card'}</div>
  <div class="pcb"><div class="lbl">Special improvements</div><div class="bt">${esc(t.title||'')}</div>
  <textarea class="in si" rows="14" data-path="${b}.notes" placeholder="Special improvements gained for this theme…">${esc(t.notes)}</textarea>
  <button class="flip" data-act="flip" data-k="${esc(key)}">↺ Front side</button></div></div>`;
  return`<div class="${cls}${flipped.has('was|'+key)?' flipin':''}">
  <div class="pch">${fellow?'Fellowship theme card':'Theme card'}</div>
  ${fellow?'':`<div class="mights">${MIGHT.map(m=>`<button class="mt ${t.might===m?'on':''}" data-act="might" data-path="${b}.might" data-v="${m}" title="${m}">${MICON[m]}<span>${m}</span></button>`).join('')}</div>`}
  <div class="pcb">
    ${fellow?'':`<input class="in type" data-path="${b}.book" value="${esc(t.book)}" placeholder="Type (themebook)" autocomplete="off">`}
    <div class="ttl">${tagRowGen(`${b}.title`,t.title,`${b}.titleBurned`,t.titleBurned,'power',fellow?'Fellowship title':'Theme title',null)}</div>
    <div class="lbl">Power tags ${addBtn(b+'.power','tag')}</div>${t.power.map((x,j)=>tagRow(b+'.power',j,x,'Power tag')).join('')}
    <div class="lbl">Weakness ${addBtn(b+'.weakness','weak')}</div>${t.weakness.map((x,j)=>weakRow(b+'.weakness',j,x)).join('')}
    <div class="lbl">Quest</div><textarea class="in" rows="2" data-path="${b}.quest" placeholder="What drives this theme?">${esc(t.quest)}</textarea>
    <div class="tracks">${['abandon','improve','milestone'].map(k=>`<div>${track(`${b}.${k}`,t[k],3)}<div class="tl">${cap(k)}</div></div>`).join('')}</div>
    <button class="flip" data-act="flip" data-k="${esc(key)}">Special improvements${t.notes.trim()?' ●':''} ↻</button>
  </div></div>`}

let renderCtx=null;
function renderSheet(s,ro){
  const player=GM&&!ro
    ?`<div class="row owner"><select class="in" data-path="ownerKey"><option value="">— Not assigned —</option>${Object.entries(S.players).map(([k,v])=>`<option value="${esc(k)}" ${s.ownerKey===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>${Object.keys(S.players).length?'':'<p class="hint">Players appear here after they open your invite link once.</p>'}`
    :`<div class="pname">${esc(ro?(s._player||'—'):me.name)}</div>`;
  const hero=`<div class="pc herocard"><div class="pch">Hero card</div><div class="pcb">
    <div class="hero-top"><div class="portrait">${s.portrait?`<button class="pimg" data-act="portrait" style="background-image:url('${s.portrait}')" title="Change picture"></button><button class="ib x pdel" data-act="noportrait" title="Remove picture">✕</button>`:`<button class="pimg empty" data-act="portrait" title="Add picture"><span>＋</span>Picture</button>`}</div>
    <div class="hero-id"><input class="in hero-name" data-path="name" value="${esc(s.name)}" placeholder="Character name" autocomplete="off">
    <div class="lbl">Player name</div>${player}</div></div>
    <div class="lbl">Fellowship relationships ${addBtn('relationships','rel')}</div>
    ${s.relationships.map((r,j)=>`<div class="row"><input class="in rel-n" data-path="relationships.${j}.name" value="${esc(r.name)}" placeholder="Companion" autocomplete="off"><input class="in" data-path="relationships.${j}.tag" value="${esc(r.tag)}" placeholder="Relationship tag" autocomplete="off"><button class="ib rb power" data-act="roll" data-kind="power" data-tp="relationships.${j}.tag" data-bp="" title="Add to roll">+</button><button class="ib x" data-act="del" data-path="relationships" data-i="${j}" title="Remove">✕</button></div>`).join('')}
    <div class="lbl">Promise</div>${track('promise',s.promise,5)}
    <div class="lbl">Quintessences</div><textarea class="in" rows="3" data-path="quintessences">${esc(s.quintessences)}</textarea>
  </div></div>`;
  const pack=`<div class="pc"><div class="pch">Backpack &amp; notes</div><div class="pcb">
    <div class="lbl">Backpack ${addBtn('backpack','tag')}</div>${s.backpack.map((x,j)=>tagRow('backpack',j,x,'Item')).join('')}
    <div class="lbl">Notes</div><textarea class="in" rows="6" data-path="notes">${esc(s.notes)}</textarea>
  </div></div>`;
  const status=`<div class="pc"><div class="pch">Statuses &amp; story tags</div><div class="pcb">
    <div class="lbl">Statuses ${addBtn('statuses','status')}</div>
    ${s.statuses.length?s.statuses.map((x,j)=>`<div class="status"><div class="row"><input class="in" data-path="statuses.${j}.name" value="${esc(x.name)}" placeholder="Status, e.g. wounded" autocomplete="off"><button class="ib rb" data-act="roll" data-kind="status" data-tp="statuses.${j}.name" data-tier="statuses.${j}.tier" title="Add to roll">±</button><button class="ib x" data-act="del" data-path="statuses" data-i="${j}" title="Remove">✕</button></div>${track(`statuses.${j}.tier`,x.tier,6,true)}</div>`).join(''):'<p class="hint">No statuses.</p>'}
    <div class="lbl">Story tags ${addBtn('storyTags','tag')}</div>

function makeAcorn(T,mats){const inner=new T.Group();const R=1,L=1.25;

const APO=Math.cos(Math.PI/6);

let conn=null,pRetry;
function startPlayer(){if(typeof Peer==='undefined'){setNet('bad','Offline');return}
  setNet('warn','Connecting…');
  if(!peer||peer.destroyed){peer=new Peer({config:ICE,debug:1});
    peer.on('open',()=>connectToGM());
    peer.on('disconnected',()=>setTimeout(()=>{if(peer&&!peer.destroyed&&peer.disconnected)try{peer.reconnect()}catch{}},1500));
    peer.on('error',e=>{console.warn('peer',e.type,e);
      if(e.type==='peer-unavailable'){setNet('warn','Waiting for the GM…');schedulePlayer(4000)}
      else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setNet('bad','Connection problem');try{peer.destroy()}catch{}schedulePlayer(4000)}});}
  else if(peer.open)connectToGM()}
function connectToGM(){if(conn)try{conn.close()}catch{}
  const c=peer.connect(JOIN,{reliable:true});conn=c;
  const wd=setTimeout(()=>{if(conn===c&&!c.open){try{c.close()}catch{}schedulePlayer(1000)}},15000);
  c.on('open',()=>{clearTimeout(wd);setNet('ok','Connected');send(c,{type:'hello',key:me.key,name:me.name})});
  c.on('data',onPlayerData);
  c.on('close',()=>{clearTimeout(wd);if(conn===c){setNet('warn','Reconnecting…');schedulePlayer(2500)}});
  c.on('error',()=>{})}

  if(!peer||peer.destroyed)return startPlayer();

  connectToGM()},ms)}

  if(GM){const h=showcaseId&&S.sheets[showcaseId];if(h)t='👁 Showing '+(h.name||'hero')+' · Stop'}
  else if(P.showcase)t='👁 '+(P.showcase.name||'Hero');
  c.hidden=!t;c.textContent=t;c.classList.toggle('on',!!t)}
async function copyLink(){const l=inviteLink();try{await navigator.clipboard.writeText(l);snack('Link copied')}catch{await ask('Copy this link',l)}}

/* ---------- start ---------- */
async function init(){buildTop();renderTray();
  if(GM){let st=null;try{st=await idb.get('state')}catch(e){console.warn(e)}S=normState(st);if(!st)await saveNow();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
    renderFeed();const sc=S.scenes.find(x=>x.id===S.current);if(sc){let img='';try{img=await idb.get('img:'+sc.id)||''}catch{}setStage(img,sc)}
    startHost()}
  else{me=ls.get('mist.p.'+JOIN,null);if(!me||!me.key)me={key:uid()+uid(),name:''};
    while(!me.name){const n=await modal(`<h3>Join the table</h3><p>What should everyone call you?</p><input class="in" placeholder="Your name" maxlength="40"><div class="mbtns"><button class="btn primary" data-m="ok">Join</button></div>`,{lock:true});me.name=(n||'').trim().slice(0,40)}
    ls.set('mist.p.'+JOIN,me);startPlayer()}
  applyWake();if(dice3d)loadThree()}
init();
})();
</script>
