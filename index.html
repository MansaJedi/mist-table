<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f1315;--glass:rgba(16,20,22,.78);--panel:rgba(14,17,19,.93);--soft:rgba(255,255,255,.05);--line:rgba(236,230,216,.14);--ink:#ece6d8;--dim:#a39d8f;--gold:#d2b47a;--gold2:#f0d9a6;--moss:#93b98d;--rust:#de8370;--r:14px;
--font:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}

/* stage */
#stage{position:fixed;inset:0;background:#0b0e10}
.layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .9s ease}
.layer.on{opacity:1}.layer.contain{background-size:contain}
#empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 20%,#25312f 0,transparent 60%),radial-gradient(ellipse at 80% 90%,#2a2a33 0,transparent 55%),#0f1315;transition:opacity .9s}
#empty.hide{opacity:0;pointer-events:none}
.mist{position:absolute;width:70vmax;height:40vmax;border-radius:50%;background:rgba(210,220,215,.07);filter:blur(60px);animation:drift 26s ease-in-out infinite alternate}
.m1{left:-20vmax;bottom:-10vmax}.m2{right:-25vmax;top:-5vmax;animation-duration:34s}
@keyframes drift{to{transform:translate(12vmax,-4vmax)}}
.etxt{position:relative;text-align:center;padding:24px}
.etitle{font-family:var(--serif);font-size:clamp(40px,8vw,72px);font-weight:600;letter-spacing:.02em;color:var(--gold2)}
.esub{color:var(--dim);margin-top:6px;font-size:17px}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 18px calc(env(safe-area-inset-left) + 12px);background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
#top>*{pointer-events:auto}
#sceneName{flex:1;min-width:0;font-family:var(--serif);font-size:22px;font-weight:600;text-shadow:0 1px 10px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:72vw}.tb::-webkit-scrollbar{display:none}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 15px;min-height:40px;font-size:15px;font-weight:600;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.on{border-color:var(--gold);color:var(--gold2)}
.btn.primary{background:var(--gold);color:#1b1710;border-color:transparent}
.btn.wide{width:100%;margin-bottom:12px}
#net{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:#666;flex:none}.dot.ok{background:var(--moss)}.dot.warn{background:var(--gold)}.dot.bad{background:var(--rust)}
@media (max-width:560px){#net .lab{display:none}#sceneName{font-size:18px}}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);z-index:30;background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right)}
#drawer.open{transform:none}
@media (min-width:760px){body.dopen #top{right:600px;transition:right .28s}}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh h2{flex:1;margin:0;font-family:var(--serif);font-size:26px;font-weight:600}
#dBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.ib{width:38px;height:38px;flex:none;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;padding:0;line-height:1}
.ib.on{background:var(--gold);color:#1b1710;border-color:transparent}
.ib.rb{font-weight:700;font-size:19px;color:var(--gold2)}
.ib.rb.weak{color:var(--rust)}
.ib.x{color:var(--dim);font-size:13px}

/* sheets */
.hcard{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hname{display:block;font-family:var(--serif);font-size:24px;font-weight:600}
.hsub{display:block;color:var(--dim);font-size:14px;margin-top:2px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.theme{border-top:3px solid var(--moss)}.theme.m-adventure{border-top-color:var(--gold)}.theme.m-greatness{border-top-color:#b98ad6}
.sec{font-family:var(--serif);font-size:22px;font-weight:600;margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px;display:flex;align-items:center;justify-content:space-between}
.add{background:none;border:none;color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:none;padding:4px 2px}
.in{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;min-height:38px}
.in:focus{outline:none;border-color:var(--gold)}
textarea.in{resize:vertical;line-height:1.35}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select.in option{background:#1a1f22;color:var(--ink)}
.hero-name{font-family:var(--serif);font-size:30px;font-weight:600;background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:4px 2px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row .in{flex:1;min-width:0}
.row .might{flex:0 0 130px}
.rel-n{flex:0 0 34%!important}
.tag.burned .in{text-decoration:line-through;opacity:.5}
.owner .lab0{color:var(--dim);font-size:14px;flex:none}
.track{display:flex;gap:6px;flex-wrap:wrap}
.box{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gold);background:transparent;padding:0;font-size:12px;font-weight:700;color:var(--gold2)}
.box.on{background:var(--gold);color:#1b1710}
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tracks .box{width:26px;height:26px}
.status{padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--line)}.status:last-child{border:none;margin:0;padding:0}
.hint{color:var(--dim);font-size:14px;line-height:1.4;margin:6px 0}
.empty-note{color:var(--dim);text-align:center;padding:24px 8px;line-height:1.45}

/* scenes */
.scene-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line);background:#1c2326 center/cover no-repeat;padding:0}
.sc.live .thumb{border-color:var(--gold)}
.live-badge{position:absolute;left:8px;top:8px;background:var(--gold);color:#1b1710;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sc-meta{display:flex;align-items:center;gap:6px;margin-top:6px}
.sc-meta span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sc-meta .ib{width:32px;height:32px}

/* players */
.link{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;font-weight:600;font-size:17px}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow .grow{flex:1}.mrow b{display:block}.mrow small{color:var(--dim)}
.switch{width:52px;height:30px;border-radius:999px;background:#444;border:none;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--moss)}.switch.on::after{left:25px}

/* dice */
#diceBtn{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:40;width:66px;height:66px;border-radius:50%;border:none;background:var(--gold);color:#1b1710;box-shadow:0 6px 24px rgba(0,0,0,.55);display:grid;place-items:center}
#diceBtn svg{width:32px;height:32px}
#diceBtn .badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--rust);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
#diceBtn.pulse{animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.12)}}
#tray{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:41;width:min(420px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(16px);pointer-events:none;transition:.2s;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#tray.open{opacity:1;transform:none;pointer-events:auto}
#tray h3{margin:0 0 8px;font-family:var(--serif);font-size:22px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:10px}
.chip{border:1px solid var(--moss);background:rgba(147,185,141,.12);border-radius:999px;padding:5px 11px;font-size:14px}
.chip.neg{border-color:var(--rust);background:rgba(222,131,112,.12)}
.chip.burnt{border-color:var(--gold);background:rgba(210,180,122,.2)}
.modrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modrow .grow{flex:1;color:var(--dim);font-size:14px}
.modrow b{min-width:34px;text-align:center;font-size:18px}
.power{font-size:15px;color:var(--dim)}.power b{color:var(--ink);font-size:20px}
.dn{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dn button{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 0;font-size:14px;font-weight:600}

#feed{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:15;display:flex;flex-direction:column;gap:6px;max-width:min(380px,calc(100vw - 110px));pointer-events:none}
.fi{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .t{font-weight:700;font-size:16px;margin:0 4px}
.good{color:var(--moss)}.mid{color:var(--gold2)}.bad{color:var(--rust)}

#toast{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
#toast.show .tcard{pointer-events:auto}
.tcard{background:rgba(12,15,17,.92);border:1px solid var(--line);border-radius:22px;padding:20px 28px;text-align:center;min-width:260px;max-width:min(460px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.twho{font-weight:600;color:var(--dim);margin-bottom:12px}.twho span{color:var(--ink)}
.die{display:inline-grid;place-items:center;width:66px;height:66px;margin:0 6px;border-radius:15px;background:var(--ink);color:#16130d;font-size:34px;font-weight:700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.die.spin{animation:wob .14s infinite alternate}
@keyframes wob{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-3px)}}
.tot{font-family:var(--serif);font-size:54px;font-weight:700;line-height:1;margin-top:12px}
.outcome{font-size:20px;font-weight:700;margin-top:2px}
.tsub{color:var(--dim);font-size:14px;margin-top:8px;line-height:1.4}

#snack{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translate(-50%,-10px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
#snack.show{opacity:1;transform:translate(-50%,0)}

#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;place-items:center;padding:20px}
#modal.show{display:grid}
.mcard{background:#161b1e;border:1px solid var(--line);border-radius:18px;padding:20px;width:min(420px,100%)}
.mcard h3{margin:0 0 12px;font-family:var(--serif);font-size:26px}
.mcard p{line-height:1.45;margin:0 0 14px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist .btn{width:100%}
</style>
</head>
<body>
<div id="stage">
  <div id="L0" class="layer"></div><div id="L1" class="layer"></div>
  <div id="empty"><div class="mist m1"></div><div class="mist m2"></div><div class="etxt"><div class="etitle">Mist Table</div><div class="esub" id="emptySub"></div></div></div>
</div>
<div id="top"><div id="sceneName"></div><div id="net"><span class="dot"></span><span class="lab">Starting…</span></div><div class="tb" id="tb"></div></div>
<div id="feed"></div>
<aside id="drawer"><div class="dh"><button class="ib" id="dBack" data-act="back" hidden>‹</button><h2 id="dTitle"></h2><button class="ib" data-act="close">✕</button></div><div id="dBody"></div></aside>
<div id="tray">
  <h3>Roll <button class="add" data-act="cleartray">Clear</button></h3>
  <div class="chips" id="trayChips"></div>
  <div class="modrow"><span class="grow">Extra modifier</span><button class="ib" data-act="mod" data-d="-1">−</button><b id="modVal">0</b><button class="ib" data-act="mod" data-d="1">+</button></div>
  <div class="modrow"><span class="power grow">Power <b id="powerVal">+0</b></span><button class="btn primary" data-act="roll2d6">Roll 2d6</button></div>
  <div class="dn">
    <button data-act="dn" data-n="4">d4</button><button data-act="dn" data-n="6">d6</button><button data-act="dn" data-n="8">d8</button><button data-act="dn" data-n="10">d10</button><button data-act="dn" data-n="12">d12</button><button data-act="dn" data-n="20">d20</button><button data-act="dn" data-n="100">d%</button>
  </div>
</div>
<button id="diceBtn" data-act="dice" aria-label="Dice"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="5" width="22" height="22" rx="5"/><circle cx="11" cy="11" r="1.6" fill="currentColor"/><circle cx="21" cy="11" r="1.6" fill="currentColor"/><circle cx="16" cy="16" r="1.6" fill="currentColor"/><circle cx="11" cy="21" r="1.6" fill="currentColor"/><circle cx="21" cy="21" r="1.6" fill="currentColor"/></svg><span class="badge" id="badge" hidden>0</span></button>
<div id="toast"></div>
<div id="snack"></div>
<div id="modal"></div>
<input type="file" id="sceneFile" accept="image/*" multiple hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const str=(v,max=300)=>typeof v==='string'?v.slice(0,max):'';
const int=(v,lo,hi)=>{v=Math.round(Number(v));return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):lo};
const arr=(v,max,fn)=>Array.isArray(v)?v.slice(0,max).map(fn):[];
const sign=v=>(v<0?'−':'+')+Math.abs(v);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const isImg=v=>typeof v==='string'&&/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1};
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v};

const JOIN=(new URLSearchParams(location.search).get('join')||'').replace(/[^\w-]/g,'');
const GM=!JOIN;
const MIGHT=['Origin','Adventure','Greatness'];
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]};
const OUT={good:'Success',mid:'Success with a cost',bad:'Consequences'};

/* ---------- storage (IndexedDB) ---------- */
const idb=(()=>{let dbp;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('mist-table',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())}})();

/* ---------- data model ---------- */
const tag=t=>({text:str(t&&t.text,120),burned:!!(t&&t.burned)});
function normTheme(t){t=t||{};return{might:MIGHT.includes(t.might)?t.might:'Origin',book:str(t.book,80),title:str(t.title,120),titleBurned:!!t.titleBurned,
  power:arr(t.power,12,tag),weakness:arr(t.weakness,6,w=>({text:str(w&&w.text,120)})),quest:str(t.quest,400),
  improve:int(t.improve,0,3),abandon:int(t.abandon,0,3),milestone:int(t.milestone,0,3),notes:str(t.notes,1000)}}
function normSheet(s){s=s||{};const themes=arr(s.themes,4,normTheme);while(themes.length<4)themes.push(normTheme({power:[{},{}],weakness:[{}]}));
  return{id:str(s.id,40)||uid(),ownerKey:s.ownerKey?str(s.ownerKey,60):null,name:str(s.name,80),promise:int(s.promise,0,5),quintessences:str(s.quintessences,1000),
  relationships:arr(s.relationships,12,r=>({name:str(r&&r.name,60),tag:str(r&&r.tag,120)})),backpack:arr(s.backpack,24,tag),themes,
  statuses:arr(s.statuses,16,x=>({name:str(x&&x.name,60),tier:int(x&&x.tier,0,6)})),storyTags:arr(s.storyTags,24,tag),notes:str(s.notes,4000)}}
const newSheet=()=>normSheet({name:'New hero',relationships:[{}],backpack:[{}],themes:[0,1,2,3].map(()=>({power:[{},{}],weakness:[{}]}))});
function normSheets(o){const r={};if(o&&typeof o==='object')for(const s of Object.values(o)){const n=normSheet(s);r[n.id]=n}return r}
function normRoll(r){if(!r||typeof r!=='object')return null;const kinds=['litm','d4','d6','d8','d10','d12','d20','d100'];if(!kinds.includes(r.kind))return null;
  return{id:str(r.id,40)||uid(),by:str(r.by,40),hero:str(r.hero,80),kind:r.kind,dice:arr(r.dice,2,d=>int(d,1,100)),mod:int(r.mod,-30,30),total:int(r.total,-50,150),
  outcome:['good','mid','bad'].includes(r.outcome)?r.outcome:'',tags:arr(r.tags,20,t=>({label:str(t&&t.label,130),value:int(t&&t.value,-6,6)})),ts:Number(r.ts)||Date.now()}}
function normState(st){st=st||{};const players={};
  if(st.players&&typeof st.players==='object')for(const[k,v]of Object.entries(st.players))players[str(k,60)]={name:str(v&&v.name,40)||'Player'};
  return{v:1,hostId:(str(st.hostId,60).replace(/[^\w-]/g,''))||('mist-'+uid()+uid()),players,sheets:normSheets(st.sheets),
  scenes:arr(st.scenes,300,x=>({id:str(x&&x.id,40)||uid(),name:str(x&&x.name,80),thumb:isImg(x&&x.thumb)?x.thumb:'',fit:x&&x.fit==='contain'?'contain':'cover'})),
  current:st.current?str(st.current,40):null,log:arr(st.log,60,normRoll).filter(Boolean)}}

let S=null;                                        // GM state (saved on the iPad)
const P={sheets:{},scene:null,players:[],log:[]};  // player view (from the GM)
let me=null;                                       // player identity
const view=()=>GM?S:P;
const myName=()=>GM?'GM':me.name;

let saveT;
const save=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,400)};
async function saveNow(){clearTimeout(saveT);try{await idb.set('state',S)}catch(e){snack('Could not save: '+(e&&e.message||e))}}

/* ---------- UI bits ---------- */
let snackT;
function snack(t){const s=$('#snack');s.textContent=t;s.classList.add('show');clearTimeout(snackT);snackT=setTimeout(()=>s.classList.remove('show'),2400)}
function setNet(state,label){$('#net').innerHTML=`<span class="dot ${state}"></span><span class="lab">${esc(label)}</span>`}
function modal(html,{lock=false}={}){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="mcard">${html}</div>`;m.classList.add('show');
  const done=v=>{m.classList.remove('show');m.onclick=null;res(v)};const inp=m.querySelector('input');
  m.onclick=e=>{const b=e.target.closest('[data-m]');if(b){const v=b.dataset.m;done(v==='ok'?(inp?inp.value:true):v==='cancel'?null:v)}else if(e.target===m&&!lock)done(null)};
  if(inp){setTimeout(()=>inp.focus(),60);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done(inp.value)}}}})}
const ask=(title,val='',ph='')=>modal(`<h3>${esc(title)}</h3><input class="in" value="${esc(val)}" placeholder="${esc(ph)}" maxlength="80"><div class="mbtns"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="ok">OK</button></div>`);
const confirmBox=(t,ok='Delete')=>modal(`<p>${esc(t)}</p><div class="mbtns"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="ok">${esc(ok)}</button></div>`).then(v=>v===true);

function buildTop(){
  $('#tb').innerHTML=GM
    ?`<button class="btn" data-act="panel" data-p="sheets">Heroes</button><button class="btn" data-act="panel" data-p="scenes">Scenes</button><button class="btn" data-act="panel" data-p="players">Players</button><button class="btn" data-act="panel" data-p="menu" aria-label="More">⋯</button>`

}

function closePanel(){panel=null;openSheetId=null;$('#drawer').classList.remove('open');document.body.classList.remove('dopen');markTop()}
function renderPanel(){if(!panel)return;let title='',html='';

    case 'sheets':title=GM?'Heroes':'My heroes';html=renderSheetList();break;
    case 'sheet':{const s=view().sheets[openSheetId];if(!s){panel='sheets';return renderPanel()}title='Hero sheet';html=renderSheet(s);break}

function renderKeep(){const b=$('#dBody'),y=b.scrollTop;renderPanel();b.scrollTop=y}
function refreshUI(w){if(panel===w)renderKeep()}
function editingInside(){const a=document.activeElement;return a&&$('#dBody').contains(a)&&a.matches('input,textarea,select')}
function refreshSheet(id){if(panel==='sheet'&&(id==null||openSheetId===id)){if(editingInside())pendingRefresh=true;else renderKeep()}if(panel==='sheets')renderKeep()}
$('#dBody').addEventListener('focusout',()=>{if(pendingRefresh)setTimeout(()=>{if(pendingRefresh&&!editingInside())renderKeep()},60)});

function themeSummary(s){return s.themes.map(t=>t.title).filter(Boolean).join(' · ')||'Tap to open'}
function renderSheetList(){const list=Object.values(view().sheets);
  let h=GM?`<button class="btn primary wide" data-act="newsheet">+ New hero</button>`:'';
  if(!list.length)h+=`<p class="empty-note">${GM?'No heroes yet. Create one, then assign it to a player inside the sheet.':'The GM hasn’t given you a hero yet.'}</p>`;

function track(path,v,n,numbered){return`<div class="track">${Array.from({length:n},(_,i)=>`<button class="box ${i<v?'on':''}" data-act="track" data-path="${path}" data-n="${i+1}">${numbered?i+1:''}</button>`).join('')}</div>`}
function tagRowGen(tp,text,bp,burned,kind,ph,del){
  return`<div class="row tag ${burned?'burned':''}"><input class="in" data-path="${tp}" value="${esc(text)}" placeholder="${ph}" autocomplete="off">`+
  (bp?`<button class="ib ${burned?'on':''}" data-act="burn" data-path="${bp}" title="Burned">🔥</button>`:'')+
  `<button class="ib rb ${kind}" data-act="roll" data-kind="${kind}" data-tp="${tp}" data-bp="${bp||''}" title="Add to roll" ${burned?'disabled':''}>${kind==='weak'?'−':'+'}</button>`+

const tagRow=(lp,j,x,ph)=>tagRowGen(`${lp}.${j}.text`,x.text,`${lp}.${j}.burned`,x.burned,'power',ph,[lp,j]);
const weakRow=(lp,j,x)=>tagRowGen(`${lp}.${j}.text`,x.text,null,false,'weak','Weakness tag',[lp,j]);
const addBtn=(path,tpl)=>`<button class="add" data-act="add" data-path="${path}" data-tpl="${tpl}">+ Add</button>`;

function renderSheet(s){

    <div class="lbl">Quintessences</div><textarea class="in" rows="2" data-path="quintessences">${esc(s.quintessences)}</textarea>
    <div class="lbl">Backpack ${addBtn('backpack','tag')}</div>${s.backpack.map((x,j)=>tagRow('backpack',j,x,'Item')).join('')}</div>`;
  h+=`<div class="sec">Statuses ${addBtn('statuses','status')}</div><div class="card">${s.statuses.length?s.statuses.map((x,j)=>`<div class="status"><div class="row"><input class="in" data-path="statuses.${j}.name" value="${esc(x.name)}" placeholder="Status, e.g. wounded" autocomplete="off"><button class="ib rb" data-act="roll" data-kind="status" data-tp="statuses.${j}.name" data-tier="statuses.${j}.tier" title="Add to roll">±</button><button class="ib x" data-act="del" data-path="statuses" data-i="${j}">✕</button></div>${track(`statuses.${j}.tier`,x.tier,6,true)}</div>`).join(''):'<p class="hint">No statuses.</p>'}</div>`;

  h+=`<div class="sec">Notes</div><textarea class="in" rows="5" data-path="notes">${esc(s.notes)}</textarea></div>`;

function renderScenes(){

/* ---------- editing ---------- */
const sendT={},dirty=new Set();
function sheetChanged(id){const s=view().sheets[id];if(!s)return;clearTimeout(sendT[id]);
  if(GM){save();sendT[id]=setTimeout(()=>{if(s.ownerKey)pushSheetsTo(s.ownerKey)},350)}
  else{dirty.add(id);sendT[id]=setTimeout(()=>flushSheet(id),350)}}
function flushSheet(id){const s=P.sheets[id];if(s&&conn&&conn.open){send(conn,{type:'sheet',sheet:s});dirty.delete(id)}}
const curSheet=el=>{const w=el.closest('.sheet');return w&&view().sheets[w.dataset.sheet]};
$('#dBody').addEventListener('input',e=>{const el=e.target;if(!el.dataset.path||el.tagName==='SELECT')return;const s=curSheet(el);if(!s)return;setPath(s,el.dataset.path,el.value);sheetChanged(s.id)});
$('#dBody').addEventListener('change',e=>{const el=e.target;if(el.tagName!=='SELECT'||!el.dataset.path)return;const s=curSheet(el);if(!s)return;
  if(el.dataset.path==='ownerKey'){const old=s.ownerKey;s.ownerKey=el.value||null;save();if(old)pushSheetsTo(old);if(s.ownerKey)pushSheetsTo(s.ownerKey);snack(s.ownerKey?'Assigned to '+S.players[s.ownerKey].name:'Unassigned');return}
  setPath(s,el.dataset.path,el.value);sheetChanged(s.id);renderKeep()});

/* ---------- dice ---------- */
let tray=[],trayMod=0;
function addToTray(s,el){const kind=el.dataset.kind;const label=(getPath(s,el.dataset.tp)||'').trim()||'(unnamed)';
  if(kind==='status'){const tier=getPath(s,el.dataset.tier)||0;if(!tier)return snack('Set the status tier first');tray.push({id:uid(),kind,label:`${label}-${tier}`,value:tier,sheetId:s.id,hero:s.name})}
  else{const bp=el.dataset.bp;if(bp&&getPath(s,bp))return snack('That tag is burned');if(tray.some(t=>t.tp===el.dataset.tp&&t.sheetId===s.id))return snack('Already in the roll');
    tray.push({id:uid(),kind,label,value:kind==='weak'?-1:1,sheetId:s.id,hero:s.name,tp:el.dataset.tp,bp,burn:false})}
  const t=tray[tray.length-1];snack(`Added ${t.label} (${sign(t.value)})`);renderTray();const b=$('#diceBtn');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}
function cycleChip(id){const i=tray.findIndex(t=>t.id===id);if(i<0)return;const t=tray[i];
  if(t.kind==='power'&&t.bp&&!t.burn){t.burn=true;t.value=3}
  else if(t.kind==='status'&&t.value>0){t.value=-t.value}
  else tray.splice(i,1);renderTray()}
function renderTray(){const sum=tray.reduce((a,t)=>a+t.value,0)+trayMod;
  $('#trayChips').innerHTML=tray.length?tray.map(t=>`<button class="chip ${t.value<0?'neg':''} ${t.burn?'burnt':''}" data-act="chip" data-id="${t.id}">${t.burn?'🔥 ':''}${esc(t.label)} <b>${sign(t.value)}</b></button>`).join('')
    :'<span class="hint">Tap + or − next to tags on a hero sheet to add them. Tap a chip to burn it (+3), flip it or remove it.</span>';
  $('#modVal').textContent=sign(trayMod).replace('+0','0').replace('−0','0');$('#powerVal').textContent=sign(sum);
  const bd=$('#badge');bd.hidden=!tray.length;bd.textContent=tray.length}
const openTray=()=>$('#tray').classList.add('open'),closeTray=()=>$('#tray').classList.remove('open');
function doRoll(){const a=rnd(6),b=rnd(6);const mod=tray.reduce((x,t)=>x+t.value,0)+trayMod;const total=a+b+mod;
  const heroes=[...new Set(tray.map(t=>t.hero).filter(Boolean))];
  const r={id:uid(),by:myName(),hero:heroes.join(', '),kind:'litm',dice:[a,b],mod,total,outcome:total>=10?'good':total>=7?'mid':'bad',tags:tray.map(t=>({label:(t.burn?'🔥 ':'')+t.label,value:t.value})),ts:Date.now()};
  for(const t of tray)if(t.burn&&t.bp){const s=view().sheets[t.sheetId];if(s){setPath(s,t.bp,true);sheetChanged(s.id);refreshSheet(s.id)}}
  tray=[];trayMod=0;renderTray();closeTray();publishRoll(r)}
function doDn(n){const v=rnd(n);closeTray();publishRoll({id:uid(),by:myName(),hero:'',kind:'d'+n,dice:[v],mod:0,total:v,outcome:'',tags:[],ts:Date.now()})}
function addRoll(r){const v=view();v.log.push(r);if(v.log.length>60)v.log.splice(0,v.log.length-60);if(GM)save();renderFeed()}
function publishRoll(r){addRoll(r);showRoll(r);if(GM){for(const c of conns)send(c,{type:'roll',roll:r})}else if(conn&&conn.open)send(conn,{type:'roll',roll:r});else snack('Not connected — only you saw this roll')}
let rollT,spinT;
function showRoll(r){const t=$('#toast');clearTimeout(rollT);clearInterval(spinT);const n=r.kind==='litm'?6:+r.kind.slice(1);
  t.innerHTML=`<div class="tcard" data-act="dismiss"><div class="twho">${esc(r.by)}${r.hero?` · <span>${esc(r.hero)}</span>`:''}</div><div>${r.dice.map(()=>'<span class="die spin">?</span>').join('')}</div><div class="tres"></div></div>`;
  t.classList.add('show');const dice=[...t.querySelectorAll('.die')];
  spinT=setInterval(()=>dice.forEach(x=>x.textContent=rnd(n)),70);
  setTimeout(()=>{clearInterval(spinT);dice.forEach((x,i)=>{x.textContent=r.dice[i];x.classList.remove('spin')});const res=t.querySelector('.tres');if(res)res.innerHTML=resultHTML(r)},700);
  rollT=setTimeout(()=>t.classList.remove('show'),4800)}
function resultHTML(r){if(r.kind!=='litm')return`<div class="tot">${r.total}</div><div class="tsub">${r.kind==='d100'?'d%':r.kind}</div>`;
  return`<div class="tot">${r.total}</div><div class="outcome ${r.outcome}">${OUT[r.outcome]||''}</div><div class="tsub">2d6 ${sign(r.mod)}${r.tags.length?'<br>'+r.tags.map(x=>esc(x.label)+' '+sign(x.value)).join(' · '):''}</div>`}
function renderFeed(){$('#feed').innerHTML=view().log.slice(-5).map(r=>`<div class="fi"><b>${esc(r.by)}</b>${r.hero?' · '+esc(r.hero):''}<span class="t ${r.outcome}">${r.total}</span><span class="${r.outcome}">${r.kind==='litm'?esc(OUT[r.outcome]||''):(r.kind==='d100'?'d%':r.kind)}</span></div>`).join('')}

/* ---------- networking: GM hosts ---------- */
let peer=null;const conns=new Set();let hostRetry;
function send(c,m){try{if(c&&c.open)c.send(m)}catch(e){console.warn(e)}}
function startHost(){clearTimeout(hostRetry);if(peer&&!peer.destroyed)try{peer.destroy()}catch{}
  if(typeof Peer==='undefined'){setNet('bad','Offline');return}
  setNet('warn','Opening table…');
  peer=new Peer(S.hostId,{config:ICE,debug:1});
  peer.on('open',()=>setNet('ok','Table open'));
  peer.on('connection',c=>{c.on('data',d=>onGMData(c,d));c.on('close',()=>dropConn(c));c.on('error',()=>dropConn(c))});
  peer.on('disconnected',()=>{setNet('warn','Reconnecting…');setTimeout(()=>{if(peer&&!peer.destroyed&&peer.disconnected)try{peer.reconnect()}catch{}},2000)});
  peer.on('error',e=>{console.warn('peer',e.type,e);
    if(e.type==='unavailable-id'){setNet('warn','Reclaiming link…');hostRetry=setTimeout(startHost,6000)}
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setNet('bad','Connection problem');hostRetry=setTimeout(startHost,5000)}});}
function dropConn(c){if(conns.delete(c)){broadcastPresence();refreshUI('players')}}
function onGMData(c,d){if(!d||typeof d!=='object')return;
  if(d.type==='hello'){const key=str(d.key,60);if(!key)return;const name=str(d.name,40).trim()||'Player';
    c._key=key;conns.add(c);const isNew=!S.players[key];S.players[key]={name};save();
    send(c,{type:'welcome',sheets:sheetsFor(key),log:S.log.slice(-20),players:presence()});sendScene(c);
    broadcastPresence();refreshUI('players');refreshSheet(null);if(isNew)snack(name+' joined');return}
  const key=c._key;if(!key||!conns.has(c))return;
  if(d.type==='sheet'){const cur=d.sheet&&S.sheets[d.sheet.id];if(!cur||cur.ownerKey!==key)return;
    const n=normSheet(d.sheet);n.id=cur.id;n.ownerKey=key;S.sheets[n.id]=n;save();
    for(const o of conns)if(o!==c&&o._key===key)send(o,{type:'sheets',sheets:sheetsFor(key)});refreshSheet(n.id)}
  else if(d.type==='roll'){const r=normRoll(d.roll);if(!r)return;r.by=S.players[key].name;addRoll(r);for(const o of conns)if(o!==c)send(o,{type:'roll',roll:r});showRoll(r)}
  else if(d.type==='name'){const name=str(d.name,40).trim();if(name){S.players[key].name=name;save();broadcastPresence();refreshUI('players')}}}
function sheetsFor(key){const o={};for(const s of Object.values(S.sheets))if(s.ownerKey===key)o[s.id]=s;return o}
function presence(){const on=new Set([...conns].map(c=>c._key));return Object.entries(S.players).filter(([k])=>on.has(k)).map(([,v])=>v.name)}
function broadcastPresence(){const p=presence();for(const c of conns)send(c,{type:'presence',players:p})}
function pushSheetsTo(key){for(const c of conns)if(c._key===key)send(c,{type:'sheets',sheets:sheetsFor(key)})}
async function sceneMsg(){const sc=S.scenes.find(x=>x.id===S.current);if(!sc)return{type:'scene',scene:null};let img='';try{img=await idb.get('img:'+sc.id)||''}catch{}
  return{type:'scene',scene:{id:sc.id,name:sc.name,fit:sc.fit,img}}}
async function sendScene(c){send(c,await sceneMsg())}
async function broadcastScene(){if(!conns.size)return;const m=await sceneMsg();for(const c of conns)send(c,m)}

/* ---------- networking: players join ---------- */
let conn=null,pRetry;
function startPlayer(){if(typeof Peer==='undefined'){setNet('bad','Offline');return}
  setNet('warn','Connecting…');
  if(!peer||peer.destroyed){peer=new Peer({config:ICE,debug:1});
    peer.on('open',()=>connectToGM());
    peer.on('disconnected',()=>setTimeout(()=>{if(peer&&!peer.destroyed&&peer.disconnected)try{peer.reconnect()}catch{}},1500));
    peer.on('error',e=>{console.warn('peer',e.type,e);
      if(e.type==='peer-unavailable'){setNet('warn','Waiting for the GM…');schedulePlayer(4000)}
      else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setNet('bad','Connection problem');try{peer.destroy()}catch{}schedulePlayer(4000)}});}
  else if(peer.open)connectToGM()}
function connectToGM(){if(conn)try{conn.close()}catch{}
  const c=peer.connect(JOIN,{reliable:true});conn=c;
  const wd=setTimeout(()=>{if(conn===c&&!c.open){try{c.close()}catch{}schedulePlayer(1000)}},15000);
  c.on('open',()=>{clearTimeout(wd);setNet('ok','Connected');send(c,{type:'hello',key:me.key,name:me.name})});
  c.on('data',onPlayerData);
  c.on('close',()=>{clearTimeout(wd);if(conn===c){setNet('warn','Reconnecting…');schedulePlayer(2500)}});
  c.on('error',()=>{})}
function schedulePlayer(ms){clearTimeout(pRetry);pRetry=setTimeout(()=>{if(conn&&conn.open)return;
  if(!peer||peer.destroyed)return startPlayer();
  if(peer.disconnected){try{peer.reconnect()}catch{try{peer.destroy()}catch{}startPlayer()}return}
  connectToGM()},ms)}
function onPlayerData(d){if(!d||typeof d!=='object')return;
  if(d.type==='welcome'||d.type==='sheets'){const incoming=normSheets(d.sheets);
    for(const id of dirty){if(incoming[id]&&P.sheets[id]){incoming[id]=P.sheets[id];setTimeout(()=>flushSheet(id),100)}}
    P.sheets=incoming;
    if(d.type==='welcome'){P.log=arr(d.log,20,normRoll).filter(Boolean);P.players=arr(d.players,50,x=>str(x,40));renderFeed();refreshUI('players')}
    if(panel==='sheet'&&!P.sheets[openSheetId])openPanel('sheets');else refreshSheet(openSheetId)}
  else if(d.type==='scene'){const sc=d.scene;if(!sc){P.scene=null;setStage(null);return}
    P.scene={id:str(sc.id,40),name:str(sc.name,80),fit:sc.fit==='contain'?'contain':'cover'};setStage(isImg(sc.img)?sc.img:'',P.scene)}
  else if(d.type==='roll'){const r=normRoll(d.roll);if(r){addRoll(r);showRoll(r)}}
  else if(d.type==='presence'){P.players=arr(d.players,50,x=>str(x,40));refreshUI('players')}}

/* ---------- scenes: images ---------- */
async function scaleImage(file,max,q){const url=URL.createObjectURL(file);try{const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Could not read image'));img.src=url});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}finally{URL.revokeObjectURL(url)}}
$('#sceneFile').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;
  for(const f of files){try{snack('Adding '+f.name+'…');const img=await scaleImage(f,2048,.84),thumb=await scaleImage(f,420,.7);
    let name=f.name.replace(/\.[^.]+$/,'');if(files.length===1){const n=await ask('Scene name',/^(image|img|photo)/i.test(name)?'':name,'e.g. The Old Mill');if(n===null)continue;name=n.trim()||name}
    const id=uid();await idb.set('img:'+id,img);S.scenes.push({id,name,thumb,fit:'cover'});await saveNow();refreshUI('scenes')}
    catch(err){snack('Could not add '+f.name+': '+err.message)}}
  snack('Tap a scene to show it to everyone')});
async function sceneMenu(id){const sc=S.scenes.find(x=>x.id===id);if(!sc)return;
  const v=await modal(`<h3>${esc(sc.name||'Scene')}</h3><div class="mlist"><button class="btn" data-m="rename">Rename</button><button class="btn" data-m="fit">${sc.fit==='cover'?'Show whole image (for maps)':'Fill the screen'}</button><button class="btn" data-m="up">Move earlier</button><button class="btn" data-m="del" style="color:var(--rust)">Delete</button><button class="btn" data-m="cancel">Cancel</button></div>`);
  if(v==='rename'){const n=await ask('Scene name',sc.name);if(n!=null){sc.name=n.trim();save();if(S.current===id)showScene(id);else refreshUI('scenes')}}
  else if(v==='fit'){sc.fit=sc.fit==='cover'?'contain':'cover';save();if(S.current===id)showScene(id);else refreshUI('scenes')}
  else if(v==='up'){const i=S.scenes.indexOf(sc);if(i>0){S.scenes.splice(i,1);S.scenes.splice(i-1,0,sc);save();refreshUI('scenes')}}
  else if(v==='del'&&await confirmBox(`Delete scene “${sc.name||'Untitled'}”?`)){S.scenes=S.scenes.filter(x=>x!==sc);idb.del('img:'+id).catch(()=>{});if(S.current===id)showScene(null);save();refreshUI('scenes')}}

/* ---------- backup ---------- */
async function exportBackup(){snack('Preparing backup…');const images={};for(const sc of S.scenes){try{images[sc.id]=await idb.get('img:'+sc.id)}catch{}}
  const name=`mist-table-backup-${new Date().toISOString().slice(0,10)}.json`;
  const blob=new Blob([JSON.stringify({app:'mist-table',v:1,exported:new Date().toISOString(),state:S,images})],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const data=JSON.parse(await f.text());if(!data||data.app!=='mist-table')throw new Error('Not a Mist Table backup');
    if(!await confirmBox('Replace everything on this device with this backup?','Replace'))return;
    const oldHost=S.hostId;S=normState(data.state);const keep=new Set(S.scenes.map(s=>'img:'+s.id));
    for(const k of await idb.keys())if(String(k).startsWith('img:')&&!keep.has(k))await idb.del(k);
    for(const sc of S.scenes){const img=data.images&&data.images[sc.id];if(isImg(img))await idb.set('img:'+sc.id,img)}
    await saveNow();renderFeed();await showScene(S.current);
    if(S.hostId!==oldHost){for(const c of conns)try{c.close()}catch{}conns.clear();startHost()}else for(const k of Object.keys(S.players))pushSheetsTo(k);
    renderKeep();snack('Backup restored')}catch(err){snack('Import failed: '+err.message)}});

/* ---------- screen wake ---------- */
let wake=null,wantWake=ls.get('mist.wake',true);
async function applyWake(){if(!wantWake||wake||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
  try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}catch{}}
document.addEventListener('pointerdown',applyWake,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;applyWake();
  if(GM){if(!peer||peer.destroyed)startHost();else if(peer.disconnected)try{peer.reconnect()}catch{startHost()}}
  else if(me&&me.name)schedulePlayer(300)});

/* ---------- clicks ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#tray').classList.contains('open'))closeTray();else closePanel()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('#tray'))closeTray();return}
  const act=el.dataset.act;const s=curSheet(el);
  if(!['chip','mod','roll2d6','dn','cleartray','dice'].includes(act))closeTray();
  switch(act){
    case 'panel':panel===el.dataset.p?closePanel():openPanel(el.dataset.p);break;
    case 'close':closePanel();break;
    case 'back':openPanel('sheets');break;
    case 'opensheet':openPanel('sheet',el.dataset.id);break;
    case 'newsheet':{const n=newSheet();S.sheets[n.id]=n;save();openPanel('sheet',n.id);break}
    case 'delsheet':if(s&&await confirmBox(`Delete ${s.name||'this hero'}? This can’t be undone.`)){const o=s.ownerKey;delete S.sheets[s.id];save();if(o)pushSheetsTo(o);openPanel('sheets')}break;
    case 'add':if(s){const tpl={tag:{text:'',burned:false},weak:{text:''},rel:{name:'',tag:''},status:{name:'',tier:1}}[el.dataset.tpl];getPath(s,el.dataset.path).push(tpl);sheetChanged(s.id);renderKeep()}break;
    case 'del':if(s){getPath(s,el.dataset.path).splice(+el.dataset.i,1);sheetChanged(s.id);renderKeep()}break;
    case 'burn':if(s){setPath(s,el.dataset.path,!getPath(s,el.dataset.path));sheetChanged(s.id);renderKeep()}break;
    case 'track':if(s){const p=el.dataset.path,n=+el.dataset.n;setPath(s,p,getPath(s,p)===n?n-1:n);sheetChanged(s.id);renderKeep()}break;
    case 'roll':if(s)addToTray(s,el);break;
    case 'dice':$('#tray').classList.contains('open')?closeTray():openTray();break;
    case 'chip':cycleChip(el.dataset.id);break;
    case 'mod':trayMod=Math.max(-9,Math.min(9,trayMod+(+el.dataset.d)));renderTray();break;
    case 'cleartray':tray=[];trayMod=0;renderTray();break;
    case 'roll2d6':doRoll();break;
    case 'dn':doDn(+el.dataset.n);break;
    case 'dismiss':$('#toast').classList.remove('show');break;
    case 'addscene':$('#sceneFile').click();break;
    case 'show':showScene(el.dataset.id);break;
    case 'blank':showScene(null);break;
    case 'scmenu':sceneMenu(el.dataset.id);break;
    case 'sharelink':if(navigator.share){try{await navigator.share({title:'Join my Mist Table',text:'Join my Legend in the Mist table:',url:inviteLink()})}catch{}}else copyLink();break;
    case 'copylink':copyLink();break;
    case 'forget':{const k=el.dataset.k,p=S.players[k];if(p&&await confirmBox(`Remove ${p.name}? Their heroes become unassigned.`,'Remove')){delete S.players[k];for(const sh of Object.values(S.sheets))if(sh.ownerKey===k)sh.ownerKey=null;for(const c of [...conns])if(c._key===k){try{c.close()}catch{}conns.delete(c)}save();broadcastPresence();renderKeep()}break}
    case 'renameme':{const n=await ask('Your name',me.name);if(n&&n.trim()){me.name=n.trim().slice(0,40);ls.set('mist.p.'+JOIN,me);if(conn&&conn.open)send(conn,{type:'name',name:me.name});renderKeep()}break}
    case 'export':exportBackup();break;
    case 'import':$('#importFile').click();break;
    case 'wake':wantWake=!wantWake;ls.set('mist.wake',wantWake);if(!wantWake&&wake){wake.release().catch(()=>{});wake=null}else applyWake();renderKeep();break;
    case 'clearlog':S.log=[];save();renderFeed();snack('Dice log cleared');break;
    case 'newlink':if(await confirmBox('Create a new invite link? Everyone will need the new link.','Reset')){S.hostId='mist-'+uid()+uid();await saveNow();for(const c of conns)try{c.close()}catch{}conns.clear();startHost();openPanel('players')}break;
  }});
async function copyLink(){const l=inviteLink();try{await navigator.clipboard.writeText(l);snack('Link copied')}catch{await ask('Copy this link',l)}}

/* ---------- start ---------- */
async function init(){buildTop();renderTray();
  if(GM){let st=null;try{st=await idb.get('state')}catch(e){console.warn(e)}S=normState(st);if(!st)await saveNow();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
    renderFeed();const sc=S.scenes.find(x=>x.id===S.current);if(sc){let img='';try{img=await idb.get('img:'+sc.id)||''}catch{}setStage(img,sc)}
    startHost()}
  else{me=ls.get('mist.p.'+JOIN,null);if(!me||!me.key)me={key:uid()+uid(),name:''};
    while(!me.name){const n=await modal(`<h3>Join the table</h3><p>What should everyone call you?</p><input class="in" placeholder="Your name" maxlength="40"><div class="mbtns"><button class="btn primary" data-m="ok">Join</button></div>`,{lock:true});me.name=(n||'').trim().slice(0,40)}
    ls.set('mist.p.'+JOIN,me);startPlayer()}
  applyWake()}
init();
})();
</script>
